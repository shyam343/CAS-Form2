<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Form</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<form class="account-form">

    <div class="form-container">

        <!-- LEFT COLUMN -->
        <div class="column-left">

            <label for="ledger_no">Ledger No.</label>
            <input type="text" id="ledger_no" name="ledger_no" value="0">

            <label for="cash_debit_exception">Cash Debit Limit Exception</label>
            <input type="text" id="cash_debit_exception" name="cash_debit_exception" value="10.00">

            <label for="clearing_exception_dr">Clearing Exception Limit (Dr.)</label>
            <input type="text" id="clearing_exception_dr" name="clearing_exception_dr" value="9,99,99,99,999.99">

            <label for="transfer_exception_dr">Transfer Exception Limit (Dr.)</label>
            <input type="text" id="transfer_exception_dr" name="transfer_exception_dr" value="10.00">

            <label for="relative_staff_id">Relative Staff ID</label>
            <input type="text" id="relative_staff_id" name="relative_staff_id">

            <label for="preferred_language_code">Preferred Language Code</label>
            <select id="preferred_language_code" name="preferred_language_code">
                <option value="INFENG">INFENG</option>
                <option value="ENGLISH">ENGLISH</option>
                <option value="NEPALI">Nepali</option>
            </select>

            <label for="calendar_base">Preferential Calendar Base</label>
            <select id="calendar_base" name="calendar_base">
                <option value="select">Select</option>
                <option value="gregorian">Gregorian</option>
                <option value="nepali">Nepali</option>
                <option value="jalali">Jalali (Persian)</option>
                <option value="bikram_sambat">Bikram Sambat</option>
                <option value="hebrew">Hebrew</option>
            </select>

            <label for="account_statement">A/c. Statement <span class="required">*</span></label>
            <select id="account_statement" name="account_statement">
                <option value="select">Select</option>
                <option value="single">Single</option>
                <option value="both">Both</option>
                <option value="more">More</option>
            </select>

            <label for="dispatch_mode">Dispatch Mode</label>
            <select id="dispatch_mode" name="dispatch_mode">
                <option value="C">C - Collect by Person</option>
                <option value="C">CC - Collect by ABC</option>
            </select>

            <label>Enable Pass Sheet Frequency</label>
            <div class="radio-group">
                <input type="radio" id="pass_yes" name="pass_sheet_frequency" value="yes">
                <label for="pass_yes">Yes</label>

                <input type="radio" id="pass_no" name="pass_sheet_frequency" value="no" checked>
                <label for="pass_no">No</label>
            </div>

            <label>A/c. Information</label>
            <div class="checkbox-group">
                <div class="checkbox-container">
                    <input type="checkbox" id="related_staff" name="related_staff">
                    <label for="related_staff">Related to Staff</label>
                </div>

                <div class="checkbox-container">
                    <input type="checkbox" id="allow_sweeps" name="allow_sweeps" checked>
                    <label for="allow_sweeps">Allow Sweeps</label>
                </div>

                <div class="checkbox-container">
                    <input type="checkbox" id="collect_charges" name="collect_charges">
                    <label for="collect_charges">Collect Charges</label>
                </div>

                <div class="checkbox-container">
                    <input type="checkbox" id="turnover_details" name="turnover_details">
                    <label for="turnover_details">Turnover Details</label>
                </div>

                <div class="checkbox-container">
                    <input type="checkbox" id="local_calendar" name="local_calendar">
                    <label for="local_calendar">Local Calendar</label>
                </div>

                <div class="checkbox-container">
                    <input type="checkbox" id="ecs_enabled" name="ecs_enabled">
                    <label for="ecs_enabled">ECS Enabled</label>
                </div>
            </div>

        </div>

        <!-- RIGHT COLUMN -->
        <div class="column-right">

            <label for="phone_no">Contact Phone No.</label>
            <input type="tel" id="phone_no" name="phone_no" placeholder="9814" required>

            <label for="cash_credit_exception">Cash Credit Limit Exception</label>
            <input type="text" id="cash_credit_exception" name="cash_credit_exception" value="10.00">

            <label for="clearing_exception_cr">Clearing Exception Limit (Cr.)</label>
            <input type="text" id="clearing_exception_cr" name="clearing_exception_cr" value="9,99,99,99,999.99">

            <label for="transfer_exception_cr">Transfer Exception Limit (Cr.)</label>
            <input type="text" id="transfer_exception_cr" name="transfer_exception_cr" value="10.00">

            <label for="preferred_language_name">Name in Preferred Language</label>
            <input type="text" id="preferred_language_name" name="preferred_language_name">

            <label>Additional Calendar Base</label>
            <div class="radio-group">
                <input type="radio" id="hijri" name="additional_calendar_base" value="hijri">
                <label for="hijri">Hijri</label>

                <input type="radio" id="none" name="additional_calendar_base" value="none" checked>
                <label for="none">None</label>
            </div>

            <label for="statement_frequency">Statement Frequency</label>
            <div class="frequency-options">
                <div class="frequency-row">

                    <select id="frequency_type" name="frequency_type">
                        <option value="Y">Yearly</option>
                        <option value="Q">Trimestely</option>
                        <option value="HQ">Semiannually</option>
                        <option value="FQ">Quarterly</option>
                    </select>

                    <select id="frequency_week" name="frequency_week">
                        <option value="1st">Weekly</option>
                        <option value="2nd">2nd Week</option>
                        <option value="3rd">3rd Week</option>
                        <option value="4th">4th Week</option>
                    </select>

                    <select id="frequency_day" name="frequency_day">
                        <option value="day">Day</option>
                    </select>

                    <select id="frequency_date" name="frequency_date">
                        <script>
                            for (let i = 1; i <= 31; i++) {
                                document.write('<option value="' + i + '">' + i + '</option>');
                            }
                        </script>
                    </select>

                    <select id="frequency_select" name="frequency_select">
                        <option value="today">Today</option>
                        <option value="yesterday">Yesterday</option>
                        <option value="tomorrow">Tomorrow</option>
                    </select>

                </div>

                <label for="next_print_date">Next Print Date</label>
                <input type="date" id="next_print_date" name="next_print_date">

            </div>

            <script>
                const today = new Date().toISOString().split('T')[0];
                document.getElementById('next_print_date').value = today;
            </script>

            <label for="notes">Notes</label>
            <textarea id="notes" name="notes" rows="4"></textarea>

        </div>
    </div>

    <div class="form-buttons">
    <button type="submit" class="btn submit-btn">Submit</button>
    <button type="reset" class="btn cancel-btn">Cancel</button>
</div>


</form>

</body>
</html>
